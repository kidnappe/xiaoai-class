name: 部署到 Cloudflare Pages

# 推送到 main 即自动部署。采用 Cloudflare 官方 CI 指南里的 wrangler-action 形态。
# 为什么是 Direct Upload + CI 而不是 Pages 的 Git 集成：
#   · wrangler CLI 无法创建 Git 集成型项目
#   · 官方明确「Git 集成项目以后不能改回 Direct Upload」，是不可逆的方向选择
# CI 里 checkout 出来的内容严格等于仓库 commit（.gitignore 已挡住内部档案），
# 所以 pages deploy . 不会把 交接文档.md / reference/ 传上去。
#
# 注意：不要在下面加 `wrangler whoami` 之类的调试步骤。它会打印账户邮箱，
# 而本仓库是 public，Actions 日志同样公开，账户信息会永久留在公开日志里。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 锁版本，避免上游漂移打断部署
          wranglerVersion: "4.131.1"
          command: pages deploy . --project-name=xiaoai-kebiao-zx
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
